# Builds the Mac app on a Mac runner: a universal .dmg (Apple silicon and Intel) and screenshots of
# the widget on a real macOS desktop, both kept as run artifacts. Nothing is published.
name: Mac build

on:
  push:
    branches: [mac]
    paths: [mac/**, ui/**, host/Chime.wav, .github/workflows/mac.yml, .github/mac-check/**]
  workflow_dispatch:
    inputs:
      probe:
        description: Also a copy of the app with the test probe, for tuning on a real Mac
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  dmg:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Page
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm test
          pnpm build

      - name: Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mac

      - name: Host tests
        working-directory: mac
        run: cargo test

      # One fixed, self-made identity, so every build is the same app to the Keychain and "Always
      # Allow" holds across updates. It is not Apple's, so Gatekeeper still asks once. Without the
      # secrets (a fork), the build stays ad hoc.
      - name: Signing identity
        env:
          P12: ${{ secrets.MAC_SIGNING_P12 }}
          PASSWORD: ${{ secrets.MAC_SIGNING_PASSWORD }}
        run: |
          [ -n "$P12" ] || exit 0
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p ci "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p ci "$keychain"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -p codesigning "$keychain"
          # "Still Today Developer", by its SHA-1, which codesign takes whether or not the system trusts it.
          echo "APPLE_SIGNING_IDENTITY=295A3D46D0543329ACDF1B9ACBE00BE31825F3A9" >> "$GITHUB_ENV"

      # On CI Tauri skips the Finder script that lays out the .dmg window (background, icon places);
      # this runner has a Finder to run it in.
      - name: Universal app and .dmg
        working-directory: mac
        timeout-minutes: 20
        env:
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        run: npx --yes @tauri-apps/cli@2 build --target universal-apple-darwin

      # Tauri signs the .dmg too, and Gatekeeper checks a signed but un-notarized disk image before it
      # will open it: a second block before the app's own. Unsigned, it opens at once and only the app
      # inside, which keeps its signature, is checked. codesign can't strip a disk image; a copy made
      # by hdiutil carries the same contents and window layout without the signature.
      - name: Unsigned .dmg
        working-directory: mac/target/universal-apple-darwin/release/bundle/dmg
        run: |
          dmg=$(ls *.dmg)
          hdiutil convert "$dmg" -format UDZO -imagekey zlib-level=9 -o "$RUNNER_TEMP/unsigned.dmg"
          mv -f "$RUNNER_TEMP/unsigned.dmg" "$dmg"
          codesign -dv "$dmg" 2>&1 | tee /dev/stderr | grep -q "not signed at all"

      # The download to offer: unlike the .dmg it meets Gatekeeper once, and the app moves itself
      # into Applications (src/install.rs). ditto keeps the bundle's signature intact.
      - name: .zip
        working-directory: mac/target/universal-apple-darwin/release/bundle
        run: |
          dmg=$(ls dmg/*.dmg)
          rm -rf zip && mkdir zip
          ditto -c -k --keepParent "macos/Still Today.app" "zip/$(basename "${dmg%.dmg}").zip"

      # First run puts the widget in the top-right corner of the main display.
      - name: Screenshots
        run: |
          mkdir shots
          open "mac/target/universal-apple-darwin/release/bundle/macos/Still Today.app"
          sleep 10
          screencapture -x shots/light.png
          if osascript -e 'tell application "System Events" to tell appearance preferences to set dark mode to true'; then
            sleep 4
            screencapture -x shots/dark.png
          fi
          # The app icon as Finder shows it.
          open -R "mac/target/universal-apple-darwin/release/bundle/macos/Still Today.app"
          sleep 4
          screencapture -x shots/finder.png
          # The .dmg's window as a tester first sees it.
          osascript -e 'tell application "Finder" to close every window' || true
          hdiutil attach mac/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          open "/Volumes/Still Today"
          sleep 4
          screencapture -x shots/dmg.png
          hdiutil detach "/Volumes/Still Today" || true
          sw_vers > shots/system.txt
          codesign -dv mac/target/universal-apple-darwin/release/bundle/dmg/*.dmg >> shots/system.txt 2>&1 || true
          lipo -archs "mac/target/universal-apple-darwin/release/bundle/macos/Still Today.app/Contents/MacOS/"* >> shots/system.txt
          # Who signed it, and what the Keychain will hold later versions to.
          codesign -dvv "mac/target/universal-apple-darwin/release/bundle/macos/Still Today.app" >> shots/system.txt 2>&1
          codesign -dr - "mac/target/universal-apple-darwin/release/bundle/macos/Still Today.app" >> shots/system.txt 2>&1

      - uses: actions/upload-artifact@v4
        with:
          name: still-today-mac
          path: |
            mac/target/universal-apple-darwin/release/bundle/zip/*.zip
            mac/target/universal-apple-darwin/release/bundle/dmg/*.dmg
      # Asked for by hand only: the same app with the test probe on 127.0.0.1:9334, to tune the look
      # beside the system's own widgets. Never handed to testers.
      - name: Probe app
        if: inputs.probe
        working-directory: mac
        run: |
          npx --yes @tauri-apps/cli@2 build --target universal-apple-darwin --features probe --bundles app
          cd target/universal-apple-darwin/release/bundle/macos
          ditto -c -k --keepParent "Still Today.app" "$RUNNER_TEMP/still-today-probe.zip"
      - uses: actions/upload-artifact@v4
        if: inputs.probe
        with:
          name: still-today-mac-probe
          path: ${{ runner.temp }}/still-today-probe.zip
      # The same checks the Windows trial build gets over CDP, through a build with the test probe.
      - name: Mac check
        run: |
          osascript -e 'quit app "Still Today"' || true
          pkill -f "Still Today.app/Contents/MacOS/" || true
          osascript -e 'tell application "Finder" to close every window' || true
          osascript -e 'tell application "System Events" to tell appearance preferences to set dark mode to false' || true
          # Runners may have Reduce Motion on; the check notes which way the morph ran.
          defaults write com.apple.universalaccess reduceMotion -bool false || true
          # And Reduce Transparency, which turns the glass solid.
          defaults write com.apple.universalaccess reduceTransparency -bool false || true
          sleep 2
          rm -rf ~/Library/"Application Support"/app.stilltoday.widget
          cd mac
          cargo build --features probe
          ./target/debug/still-today > ../shots/probe.log 2>&1 &
          failed=0
          python3 ../.github/mac-check/check.py ../shots/check || { cat ../shots/probe.log; failed=1; }
          # Liquid Glass as the tab bar's selection pill, recorded. Not a check.
          python3 ../.github/mac-check/pill.py ../shots/pill || true
          exit $failed

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/
