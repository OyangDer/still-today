[package]
name = "still-today"
version = "0.2.3"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde_json = "1"
sys-locale = "0.3"
tauri-plugin-opener = "2"
# Secrets: the macOS Keychain (Credential Manager when trying the build on Windows).
keyring = { version = "3", features = ["apple-native", "windows-native"] }
reqwest = { version = "0.12", features = ["gzip", "deflate"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
tokio = { version = "1", features = ["time"] }
rodio = { version = "0.20", default-features = false, features = ["wav"] }

[features]
# Release builds serve the bundled ui/dist; debug builds without it load devUrl when one is set.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = true
codegen-units = 1
strip = true
